[package]
name = "linkfyr-desktop"
description = "LinkFYR desktop application (Tauri 2 shell â€” the only crate allowed to depend on Tauri)"
version.workspace = true
edition.workspace = true
license-file.workspace = true
repository.workspace = true

[lib]
name = "linkfyr_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
linkfyr-core.workspace = true
linkfyr-model.workspace = true
linkfyr-ipc.workspace = true
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
