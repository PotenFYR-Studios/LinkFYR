# deny.toml — cargo-deny policy (advisories, licenses, bans, sources)

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CDLA-Permissive-2.0",
  "MPL-2.0", "OpenSSL", "BSL-1.0", "Unicode-DFS-2016",
]
# WebKit/GTK system libs arrive via pkg-config at link time, not crates.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
