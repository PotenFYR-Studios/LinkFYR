name: linkfyr-tests

services:
  rust:
    build:
      context: .
      dockerfile: docker/test.Dockerfile
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - target-cache:/app/target
    command: ["bash", "scripts/docker/rust-gate.sh"]

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    command: ["bash", "scripts/docker/frontend-gate.sh"]

volumes:
  cargo-registry:
  cargo-git:
  target-cache:
