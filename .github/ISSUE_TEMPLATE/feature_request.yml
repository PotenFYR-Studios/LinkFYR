name: Feature Request
description: Suggest an idea or new capability for LinkFYR
labels: [enhancement]
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Ideas for new tools, platforms, automation, or UI/CLI improvements are welcome. LinkFYR is local-only and free (Apache-2.0 + Commons Clause), so proposals that can run on the user's own machine and stay self-hostable fit best.

  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do, and what's missing or awkward about doing it today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? For tools, sketch the measurement or action and how the result should be reported.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've tried or considered, and why they don't fit.
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I checked the [roadmap](https://github.com/PotenFYR-Studios/LinkFYR/blob/main/docs/content/roadmap.md) and this is not already planned
          required: true
        - label: I searched existing issues for duplicates
          required: true