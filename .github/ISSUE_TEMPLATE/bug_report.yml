name: Bug Report
description: Something in LinkFYR is broken or behaving unexpectedly
labels: [bug]
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below; the more precise the reproduction, the faster this gets fixed.

        > [!NOTE]
        > If this is a **security vulnerability** (token bypass, IPC abuse, update-pipeline tampering, etc.), do **not** use this form: follow the confidential process in [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected to happen instead.
    validations:
      required: true

  - type: dropdown
    id: app-version
    attributes:
      label: LinkFYR version
      description: Shown in the app footer, `linkfyr --version`, or the release tag you installed.
      options:
        - 0.1.0
        - Other (please specify below)
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 10/11 (x64)
        - Windows (ARM64)
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (x64)
        - Linux (ARM64)
        - Other (please specify below)
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Desktop app (UI)
        - CLI (linkfyr)
        - Optimization tools (optimize run ...)
        - Bridges
        - linkfyrd background service
        - Mobile companion
        - Installer / update
        - Other (please specify below)
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce, including the exact command (`linkfyr optimize run ...`) or UI path where relevant.
      placeholder: |
        1. Run `linkfyr optimize run route_scan target=example.com`
        2. Observe the crash / wrong output
      render: bash
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics output
      description: Paste the JSON from `linkfyr optimize run self_test`, plus the failing tool output if applicable.
      placeholder: |
        **Scrub before pasting:** replace tokens, public IPs, and hostnames you consider private with `<redacted>`.
      render: json
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log excerpt (app log, or `RUST_LOG=debug` output for the CLI).
      render: text
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I removed secrets, tokens, and private addresses from anything pasted above
          required: true